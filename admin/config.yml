# Website editor (Sveltia CMS) at belladuong.com/admin.
# Field names must match the keys in _data/*.yml.
backend:
  name: github
  repo: Takoodachi/bella-portfolio
  branch: main
  base_url: https://sveltia-cms-auth.takoodachi.workers.dev
  auth_scope: public_repo
site_url: https://belladuong.com
display_url: https://belladuong.com
media_folder: assets
public_folder: /assets
media_libraries:
  default:
    config:
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2000
          height: 2000
collections:
- name: pages
  label: Pages
  icon: description
  editor:
    preview: false
  description: Every word and photo on each page. Saving publishes the change — the live site updates in about a minute.
  files:
  - name: home
    label: Home
    file: _data/home.yml
    fields:
    - name: meta
      label: Browser tab & search results
      widget: object
      fields:
      - name: title
        label: Browser tab title
        widget: string
      - name: description
        label: Search-result description
        widget: text
        hint: One sentence that search engines show under the title.
      collapsed: true
    - name: hero
      label: Big slideshow at the top
      widget: object
      fields:
      - name: slides
        label: Slideshow photos
        widget: list
        hint: Drag to reorder. Wide (landscape) photos work best.
        fields:
        - name: image
          label: Photo
          widget: image
        - name: alt
          label: Photo description
          widget: string
          hint: What the photo shows, for people using screen readers.
        summary: '{{fields.alt}}'
      - name: kicker
        label: Small line above the name
        widget: string
      - name: first_name
        label: First name
        widget: string
      - name: last_name
        label: Last name
        widget: string
      - name: tagline
        label: Tagline
        widget: text
      - name: button
        label: Button text
        widget: string
    - name: marquee
      label: Scrolling words
      widget: list
      hint: The words that scroll across under the slideshow.
      field:
        name: word
        label: Word
        widget: string
    - name: intro
      label: Introduction
      widget: object
      fields:
      - name: eyebrow
        label: Small label
        widget: string
      - name: heading
        label: Heading
        widget: string
      - name: text
        label: Text
        widget: richtext
        buttons: &id001
        - bold
        - italic
        - link
        editor_components: []
        modes:
        - rich_text
        - raw
      - name: button
        label: Button text
        widget: string
      - name: image
        label: Photo
        widget: image
      - name: alt
        label: Photo description
        widget: string
        hint: What the photo shows, for people using screen readers.
      - &id002
        name: focus
        label: Photo focus
        widget: string
        hint: Which part stays visible when the photo is cropped, e.g. top, center, 30% 50%. Empty = the middle.
        required: false
    - name: quote
      label: Quote band
      widget: object
      fields:
      - name: eyebrow
        label: Small label
        widget: string
      - name: text
        label: Quote
        widget: text
      - name: button
        label: Button text
        widget: string
    - name: chapters
      label: Chapters
      widget: object
      fields:
      - name: title
        label: Section title
        widget: string
      - name: subtitle
        label: Section subtitle
        widget: string
      - name: items
        label: Chapters
        widget: list
        fields:
        - name: title
          label: Chapter name
          widget: string
          hint: Shown big on the left as you scroll.
        - name: label
          label: Small label
          widget: string
        - name: heading
          label: Heading
          widget: string
        - name: text
          label: Text
          widget: richtext
          buttons: *id001
          editor_components: []
          modes:
          - rich_text
          - raw
        - name: button
          label: Button text
          widget: string
        - name: link
          label: Button link
          widget: string
          hint: A page on this site (like writing.html or leadership.html#aafc) or a full web address.
        - name: slides
          label: Photos
          widget: list
          hint: They wipe from one to the next.
          fields:
          - name: image
            label: Photo
            widget: image
          - name: alt
            label: Photo description
            widget: string
            hint: What the photo shows, for people using screen readers.
          summary: '{{fields.alt}}'
        summary: '{{fields.title}}'
