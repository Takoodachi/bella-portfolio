photography:
  nav_label: Photography
  eyebrow: Category One · Artist Statement
  heading: Photography
  statement: 'My photography lives in the same place my writing does: the in-between. I''m drawn to thresholds — doorways, windows, reflections, the moment before something happens — and to the quiet evidence people leave behind in a space. This portfolio explores how light and framing can hold two things at once: what a place is, and what it feels like to stand inside it.'
