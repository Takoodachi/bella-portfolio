singing:
  eyebrow: Category Four
  heading: Singing
  text: In choir, no voice works alone. Singing has taught me the discipline of blend — listening harder than you sing, tuning to the people around you, and carrying your own line anyway. I was selected for our Advanced Chorus, The First, and our a cappella group, and was invited to perform alongside the Princeton Tigerlilies — Princeton's oldest all-female a cappella group, founded in 1971 — in a campus showcase. It's the closest thing I know to the "beautiful song" I once felt outside of; here, I know the lyrics.
