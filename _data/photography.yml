dance:
  eyebrow: Category Two
  heading: Dance
  text: Dance is where I stop translating. Choreography asks for honesty the way writing does — a phrase, a breath, a held moment — but the language is entirely physical. After ten years of training, I choreograph my own contemporary and lyrical pieces, and every show teaches me something new about trusting the people moving beside me.
