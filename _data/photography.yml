theater:
  eyebrow: Category Three
  heading: Theater
  text: On stage, I get to live inside someone else's story for a while — and bring the audience with me. I've played Amy in *Little Women* and Lisa in *Mamma Mia!*, and was an ensemble member in *Pippin* on our mainstage. Theater has taught me projection, presence, and how much work hides behind a single effortless-looking scene.
