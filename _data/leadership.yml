    image: /assets/tfac/tfac-09.jpg
    alt: Phu Hai students in their classroom
    focus: ''
    heading: Curriculum expansion
    text: Working with local educators, I diagnosed the systemic obstacles in our classrooms — unreliable technology, few books at home, and students too nervous to speak up. Then I designed and compiled an original suite of gamified lesson materials to make practice feel like play and keep students engaged between sessions.
  initiatives:
    heading: Leadership initiatives
    text: 'As Co-President, I''ve helped grow Tutors for a Cause from one eighth-grade volunteer into an international team of 15 tutors. I also tell our students'' stories: my feature "Beyond the Screen," photographed by Rocco Ho, is being pitched to national and diaspora outlets to raise awareness and support for the program.'
