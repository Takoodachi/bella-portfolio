aafc:
  nav_label: AAFC
  eyebrow: Organizer · Asian & Asian American Association
  heading: Asian American Footsteps Conference
  text: |-
    As President of our school's Asian & Asian American Association, a 100+ member affinity group, I organized the regional Asian American Footsteps Conference for more than 200 students from over 20 schools — managing the programming, marketing, and logistics.

    For a girl who is often "the only one from Vietnam" in the room, AAFC is the rare space where the quiet parts don't need explaining. I wanted every student who came to feel that too.
  image: /assets/aafc/aafc-02.jpg
  alt: Students at the Asian American Footsteps Conference
  focus: ''
  recap:
    heading: Event recap
    text: The day was full of stories that sounded like mine, from students who had turned that in-between feeling into art, activism, and leadership. I ran a dumpling workshop myself, and it became the conference's first session to sell out.
