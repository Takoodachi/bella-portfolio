values:
  eyebrow: What I care about
  heading: Values I keep coming back to
  items:
  - title: Passing it on
    text: Whatever education gives me, I find ways to give to someone else — a lesson my parents carried across an ocean.
  - title: Courage in quiet
    text: My students in Huế taught me that silence is often courage gathering itself. I try to listen for it — in others and in myself.
  - title: Carrying culture
    text: From áo dài to cà phê trứng, I write and perform to keep the recipes, names, and stories my family carried here alive.
